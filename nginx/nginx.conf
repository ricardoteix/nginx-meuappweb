# =============================================================================
#  nginx.conf — Contexto main (global)
#  Hierarquia: main > events > http > server > location
#  Diretivas do contexto pai são herdadas pelos filhos (salvo se sobrescritas).
# =============================================================================
user  nginx;
worker_processes  auto;            # 1 worker por núcleo de CPU (modelo event-driven)
worker_rlimit_nofile  65535;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;      # conexões simultâneas por worker
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Logs com IP real, host e tempo de upstream -------------------------
    log_format  main  '$remote_addr - [$time_local] "$host" "$request" '
                      '$status $body_bytes_sent rt=$request_time '
                      'upstream=$upstream_addr urt=$upstream_response_time '
                      '"$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    # --- Performance ---------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  30s;

    # --- Hardening (Parte 3 do e-book) ---------------------------------------
    server_tokens          off;    # oculta a versão do NGINX em headers e páginas de erro
    client_max_body_size   10m;    # limite de upload
    client_body_timeout    10s;    # timeouts rígidos contra Slowloris
    client_header_timeout  10s;
    send_timeout           10s;

    # --- Compressão gzip ------------------------------------------------------
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types  text/plain text/css application/javascript application/json
                image/svg+xml application/xml;

    # --- Rate limiting (algoritmo Leaky Bucket) -------------------------------
    # 10 MB de memória compartilhada guardam ~160.000 IPs distintos.
    limit_req_zone  $binary_remote_addr  zone=api_geral:10m  rate=20r/s;
    limit_req_zone  $binary_remote_addr  zone=login:10m      rate=5r/m;
    limit_req_status  429;
    limit_conn_zone $binary_remote_addr  zone=conn_por_ip:10m;
    limit_conn_status 429;

    # --- WebSocket + keepalive com upstreams ---------------------------------
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       '';
    }

    # --- Upstreams (nomes = serviços do docker compose) -----------------------
    upstream web_upstream {
        server web:3000;
        keepalive 16;
    }

    upstream admin_upstream {
        server admin:3001;
        keepalive 16;
    }

    upstream api_upstream {
        least_conn;                # envia para a instância com menos conexões ativas
        server api:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # --- TLS no contexto http: vale para TODOS os server blocks ---------------
    # (protocolos/cifras precisam valer também para o default_server da 443,
    #  pois o handshake começa antes de o NGINX saber qual site foi pedido)
    include /etc/nginx/snippets/ssl.conf;

    # Um arquivo por site/serviço (convenção conf.d)
    include /etc/nginx/conf.d/*.conf;
}
