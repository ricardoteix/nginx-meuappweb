# =============================================================================
#  20-api.conf — https://api.meuappweb.com.br  ->  container api:8080
# =============================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name api.meuappweb.com.br;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/csp-api.conf;

    limit_conn conn_por_ip 50;

    # Login: anti-brute force (5 req/min por IP, tolera pico de 3) -> HTTP 429
    location = /v1/auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://api_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Documentação interativa do FastAPI (Swagger UI / ReDoc).
    # Como este location declara add_header (CSP própria), ele NÃO herda os
    # headers do server: por isso o snippet de segurança é incluído de novo.
    location ~ ^/(docs|docs/oauth2-redirect|redoc|openapi\.json)$ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-api-docs.conf;
        proxy_pass http://api_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    location / {
        limit_req zone=api_geral burst=40 nodelay;
        proxy_pass http://api_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}
