# =============================================================================
#  10-web.conf — https://meuappweb.com.br  ->  container web:3000
# =============================================================================

# www -> domínio principal (URL canônica)
server {
    listen 443 ssl;
    http2 on;
    server_name www.meuappweb.com.br;

    include /etc/nginx/snippets/security-headers.conf;
    return 301 https://meuappweb.com.br$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name meuappweb.com.br;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/csp-spa.conf;

    limit_conn conn_por_ip 50;

    # Login também protegido contra brute force quando chamado pela mesma origem
    location = /api/v1/auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://api_upstream/v1/auth/login;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Same-Origin real: o frontend chama /api/... no PRÓPRIO domínio e o NGINX
    # repassa ao backend. Para o navegador é mesma origem: o CORS deixa de existir.
    # A barra final em proxy_pass remove o prefixo /api/ antes de repassar.
    location /api/ {
        limit_req zone=api_geral burst=40 nodelay;
        proxy_pass http://api_upstream/;
        include /etc/nginx/snippets/proxy.conf;
    }

    # SPA pública (o fallback para index.html é feito pelo container web)
    location / {
        proxy_pass http://web_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}
