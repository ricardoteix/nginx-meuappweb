# =============================================================================
#  30-admin.conf — https://admin.meuappweb.com.br  ->  container admin:3001
# =============================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name admin.meuappweb.com.br;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/csp-spa.conf;

    limit_conn conn_por_ip 30;

    # Em produção, restrinja o painel à rede interna/VPN, por exemplo:
    # allow 10.0.0.0/8;
    # allow 192.168.0.0/16;
    # deny  all;

    # Login do painel com rate limiting rígido (anti-brute force)
    location = /api/v1/auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://api_upstream/v1/auth/login;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Demais chamadas da API na mesma origem (sem CORS)
    location /api/ {
        limit_req zone=api_geral burst=40 nodelay;
        proxy_pass http://api_upstream/;
        include /etc/nginx/snippets/proxy.conf;
    }

    location / {
        proxy_pass http://admin_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}
