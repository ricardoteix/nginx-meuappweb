# =============================================================================
#  00-default.conf — redirecionamento HTTP -> HTTPS e "catch-all"
# =============================================================================

# Nunca trafegar dados desprotegidos na porta 80: redirecionamento 301 permanente
server {
    listen 80;
    server_name meuappweb.com.br www.meuappweb.com.br
                api.meuappweb.com.br admin.meuappweb.com.br;

    return 301 https://$host$request_uri;
}

# Qualquer outro Host na porta 80 (ex.: acesso por IP, scanners): fecha a conexão
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# Qualquer outro nome (SNI) na 443: recusa o handshake TLS sem expor certificado
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_reject_handshake on;
}
