# CSP relaxada apenas para o Swagger UI (/docs) e ReDoc (/redoc) do FastAPI,
# que carregam JS/CSS do CDN jsDelivr e usam um script inline de inicialização.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://fastapi.tiangolo.com https://cdn.redoc.ly; worker-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'" always;
