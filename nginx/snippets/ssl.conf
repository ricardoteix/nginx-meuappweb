# =============================================================================
#  TLS moderno — incluído no contexto http (nginx.conf)
# =============================================================================
ssl_certificate      /etc/nginx/certs/fullchain.pem;            # cadeia completa
ssl_certificate_key  /etc/nginx/certs/meuappweb.com.br.key;

# Apenas protocolos modernos: SSLv2/v3, TLS 1.0 e 1.1 ficam desabilitados
ssl_protocols  TLSv1.2 TLSv1.3;

# Cifras fortes com Forward Secrecy (ECDHE) e criptografia autenticada (AEAD)
ssl_ciphers  'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256';
ssl_prefer_server_ciphers  on;
ssl_dhparam  /etc/nginx/certs/dhparam.pem;

# Session resumption (performance) sem tickets (preserva o Forward Secrecy)
ssl_session_timeout  1d;
ssl_session_cache    shared:SSL:10m;
ssl_session_tickets  off;

# OCSP Stapling: só funciona com certificados de uma CA pública
# (ex.: Let's Encrypt). Com a CA local deste exemplo, fica desligado.
# ssl_stapling         on;
# ssl_stapling_verify  on;
# ssl_trusted_certificate /etc/nginx/certs/chain.pem;
# resolver 1.1.1.1 8.8.8.8 valid=300s;
