# =============================================================================
#  Headers HTTP de segurança (comuns a todos os sites)
#
#  ATENÇÃO À HERANÇA: se um bloco location declarar QUALQUER add_header,
#  ele deixa de herdar estes headers. Nesse caso, inclua este snippet de novo
#  dentro do location.
# =============================================================================

# HSTS — em DESENVOLVIMENTO usamos 5 minutos para não "travar" o navegador
# caso você remova a CA local. Em PRODUÇÃO use no mínimo 1 ano:
#   add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;

add_header X-Frame-Options         "DENY" always;
add_header X-Content-Type-Options  "nosniff" always;
add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
