# =============================================================================
#  Proxy reverso preservando o contexto do cliente
# =============================================================================
proxy_http_version 1.1;

# Preservar dados originais do cliente
proxy_set_header Host               $host;
proxy_set_header X-Real-IP          $remote_addr;
proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto  $scheme;
proxy_set_header X-Forwarded-Host   $host;
proxy_set_header X-Forwarded-Port   $server_port;

# WebSocket (ex.: HMR do Vite/Webpack) + keepalive com o upstream
proxy_set_header Upgrade     $http_upgrade;
proxy_set_header Connection  $connection_upgrade;

# Timeouts e failover entre instâncias
proxy_connect_timeout  5s;
proxy_send_timeout     30s;
proxy_read_timeout     30s;
proxy_next_upstream    error timeout http_502 http_503;
proxy_next_upstream_tries 2;

# Não repassar o header do upstream que revela tecnologia
proxy_hide_header X-Powered-By;
proxy_hide_header Server;
