name: ci

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Subir a stack
        run: docker compose up -d --build

      - name: Aguardar o NGINX
        run: |
          for i in $(seq 1 60); do
            if curl -sk --resolve api.meuappweb.com.br:443:127.0.0.1 https://api.meuappweb.com.br/health | grep -q ok; then
              echo "pronto"; exit 0
            fi
            sleep 2
          done
          docker compose ps; docker compose logs; exit 1

      - name: Validar configuração (nginx -t)
        run: docker compose exec -T nginx nginx -t

      - name: Testes de fumaça
        run: ./scripts/smoke-test.sh

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs
