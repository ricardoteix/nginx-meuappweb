# Servidor interno do frontend (admin) — porta 3001 (acessível só pela rede do compose)
server {
    listen       3001;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    server_tokens      off;
    absolute_redirect  off;   # redirecionamentos relativos (não vazam a porta 3001)

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Assets com versão no nome -> cache imutável de 1 ano
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files  $uri =404;
    }

    # O index.html nunca é cacheado: sempre aponta para os assets da versão atual
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Garante funcionamento das rotas SPA (History API)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
